name: Build Fluent Reader Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream Source Code
        uses: actions/checkout@v4
        with:
          repository: yang991178/fluent-reader
          ref: master

      - name: Checkout My Patches
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: my-patches
          ref: ${{ github.ref }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch Version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION="${CURRENT_VERSION}-${SHORT_SHA}"
          echo "Building version: $NEW_VERSION"
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

      - name: Install Dependencies
        run: |
          npm install
          # 1. Install Piper TTS Wrapper
          npm install @mintplex-labs/piper-tts-web
          # 2. Install Piper WASM Binaries
          npm install @diffusionstudio/piper-wasm
          # 3. Install ONNX Runtime
          npm install onnxruntime-web
          # 4. Install Webpack Copy Plugin
          npm install --save-dev copy-webpack-plugin
          # 5. Install JS-YAML
          npm install --save-dev js-yaml

      - name: Fix Piper TTS Package Exports
        run: |
          node -e "
          const fs = require('fs');
          const path = './node_modules/@mintplex-labs/piper-tts-web/package.json';
          if (fs.existsSync(path)) {
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.exports['.'] = {
              import: pkg.exports['.'].import,
              require: pkg.exports['.'].import,
              default: pkg.exports['.'].import,
              types: pkg.exports['.'].types
            };
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          }
          "

      - name: Apply Custom Files
        run: |
          # 1. Overwrite article.tsx (Simplified paths)
          cp -f my-patches/article.tsx src/components/article.tsx
          
          # 2. Copy Patch Scripts
          cp -f my-patches/patch-webpack.js .
          cp -f my-patches/patch-electron-builder.js .

          # Clean up patches folder
          rm -rf my-patches

      - name: Patch Webpack Config
        run: |
          echo "Injecting WASM copy plugin into webpack config..."
          node patch-webpack.js

      - name: Patch Electron Builder Config (Disable ASAR)
        run: |
          echo "Disabling ASAR compression..."
          node patch-electron-builder.js

      - name: Apply Preferences (Fonts, etc)
        run: |
          sed -i 's/"Segoe UI"/"Noto Kufi Arabic", "Rubik", "Segoe UI"/g' src/scripts/settings.ts
          sed -i 's/"Segoe UI"/"Noto Kufi Arabic", "Rubik", "Segoe UI"/g' dist/styles/global.css
          sed -i 's/"Segoe UI"/"Noto Kufi Arabic", "Rubik", "Segoe UI"/g' dist/article/article.css
          sed -i 's/ViewType.Cards/ViewType.List/g' src/main/settings.ts
          sed -i 's/this.openTarget = SourceOpenTarget.Local/this.openTarget = SourceOpenTarget.FullContent/' src/scripts/models/source.ts

      - name: Build
        run: |
          rm -rf node_modules/.cache/webpack
          npm run build

      - name: Package Linux AppImage
        run: npm run package-linux

      - name: Get Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluentReader-${{ steps.version.outputs.version }}-Linux-x64
          path: bin/linux/x64/*.AppImage
          compression-level: 0
