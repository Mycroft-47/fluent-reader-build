name: Build Fluent Reader Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream Source Code
        uses: actions/checkout@v4
        with:
          repository: yang991178/fluent-reader
          ref: master

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Version with Commit Hash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION="${CURRENT_VERSION}-${SHORT_SHA}"
          echo "Building version: $NEW_VERSION (upstream commit: $SHORT_SHA)"
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

      - name: Install Dependencies
        run: npm install

      - name: Build React/TypeScript Code
        run: npm run build

      - name: Package Linux AppImage
        run: npm run package-linux

      - name: Get Final Version for Artifact
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluentReader-${{ steps.version.outputs.version }}-Linux-x64
          path: bin/linux/x64/*.AppImage
          if-no-files-found: error
          compression-level: 0
