name: Build Fluent Reader Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream Source Code
        uses: actions/checkout@v4
        with:
          repository: yang991178/fluent-reader
          ref: master

      - name: Checkout My Patches
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: my-patches
          ref: ${{ github.ref }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch Version with Commit Hash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION="${CURRENT_VERSION}-${SHORT_SHA}"
          echo "Building version: $NEW_VERSION (upstream commit: $SHORT_SHA)"
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

      - name: Install Dependencies
        run: |
          npm install
          npm install @mintplex-labs/piper-tts-web

      # --- FIX 1: Smart Bundle WASM Files (Finds them automatically) ---
      - name: Bundle WASM Files
        run: |
          echo "Creating wasm-files directory..."
          mkdir -p wasm-files/onnx
          mkdir -p wasm-files/piper
          
          echo "Locating and copying ONNX Runtime files..."
          # Find the files anywhere in node_modules to avoid path errors
          find node_modules -name "ort-wasm-simd-threaded.wasm" -exec cp {} wasm-files/onnx/ \;
          find node_modules -name "ort-wasm-simd-threaded.mjs" -exec cp {} wasm-files/onnx/ \;
          
          echo "Locating and copying Piper Phonemize files..."
          find node_modules -name "piper_phonemize.wasm" -exec cp {} wasm-files/piper/ \;
          find node_modules -name "piper_phonemize.data" -exec cp {} wasm-files/piper/ \;
          
          echo "Verifying WASM bundle..."
          ls -R wasm-files/
          
          # Fail if empty (sanity check)
          if [ -z "$(ls -A wasm-files/piper)" ]; then
             echo "Error: Piper files not found!"
             exit 1
          fi

      # --- FIX 2: Create Path Helper (Inside utils folder) ---
      - name: Create WASM Path Helper
        run: |
          mkdir -p src/utils
          cat <<'EOF' > src/utils/wasm-paths.ts
          import { app } from 'electron';
          import * as path from 'path';

          export function getWasmPaths(): {
            onnxWasm: string;
            piperData: string;
            piperWasm: string;
          } {
            const isDev = process.env.NODE_ENV === 'development' || !app.isPackaged;
            
            if (isDev) {
              const basePath = path.join(__dirname, '../../');
              // Dev paths (approximate, might need adjustment if running dev mode)
              return {
                onnxWasm: path.join(basePath, 'node_modules/onnxruntime-web/dist/'),
                piperWasm: path.join(basePath, 'node_modules/@mintplex-labs/piper-tts-web/dist/piper_phonemize.wasm'),
                piperData: path.join(basePath, 'node_modules/@mintplex-labs/piper-tts-web/dist/piper_phonemize.data'),
              };
            } else {
              // Prod paths (inside AppImage)
              const resourcesPath = process.resourcesPath;
              const wasmBase = path.join(resourcesPath, 'wasm-files');
              
              return {
                onnxWasm: path.join(wasmBase, 'onnx/'),
                piperWasm: path.join(wasmBase, 'piper/piper_phonemize.wasm'),
                piperData: path.join(wasmBase, 'piper/piper_phonemize.data'),
              };
            }
          }

          export function setupWasmPathIPC(ipcMain: any) {
            ipcMain.handle('get-wasm-paths', () => {
              return getWasmPaths();
            });
          }
          EOF

      # --- FIX 3: Patch Electron Main Process ---
      - name: Patch Main Process
        run: |
          # Add import to src/electron.ts
          sed -i '1s/^/import { setupWasmPathIPC } from ".\/utils\/wasm-paths";\n/' src/electron.ts
          
          # Append setup call to end of file
          cat <<'EOF' >> src/electron.ts

          import { ipcMain } from "electron";
          app.whenReady().then(() => {
              setupWasmPathIPC(ipcMain);
          });
          EOF

      # --- FIX 4: Patch Preload Script ---
      - name: Patch Preload Script
        run: |
          cat <<'EOF' >> src/preload.ts
          
          import { ipcRenderer } from "electron";
          contextBridge.exposeInMainWorld('wasmPaths', {
            get: () => ipcRenderer.invoke('get-wasm-paths')
          });
          EOF

      # --- FIX 5: Patch package.json for ASAR Unpack ---
      - name: Patch package.json
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          
          // Ensure build config exists
          pkg.build = pkg.build || {};
          
          // Add files to include
          pkg.build.files = pkg.build.files || ['dist/**/*', 'node_modules/**/*', 'package.json'];
          pkg.build.files.push('wasm-files/**/*');
          
          // Add asarUnpack to keep WASM files accessible
          pkg.build.asarUnpack = pkg.build.asarUnpack || [];
          pkg.build.asarUnpack.push('wasm-files/**/*');
          
          // Add extraResources to copy the folder
          pkg.build.extraResources = pkg.build.extraResources || [];
          pkg.build.extraResources.push({
            from: 'wasm-files',
            to: 'wasm-files',
            filter: ['**/*']
          });
          
          // Fix exports for Webpack (Piper)
          const piperPath = './node_modules/@mintplex-labs/piper-tts-web/package.json';
          if (fs.existsSync(piperPath)) {
             const piperPkg = JSON.parse(fs.readFileSync(piperPath, 'utf8'));
             piperPkg.exports['.'] = {
               import: piperPkg.exports['.'].import,
               require: piperPkg.exports['.'].import,
               default: piperPkg.exports['.'].import,
               types: piperPkg.exports['.'].types
             };
             fs.writeFileSync(piperPath, JSON.stringify(piperPkg, null, 2));
          }
          
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('✓ Patched package.json for WASM bundling and Exports');
          "

      - name: Inject Custom Article Component
        run: |
          echo "Overwriting article.tsx..."
          cp -f my-patches/article.tsx src/components/article.tsx
          rm -rf my-patches

      - name: Apply Customizations
        run: |
          sed -i 's/"Segoe UI"/"Noto Kufi Arabic", "Rubik", "Segoe UI"/g' src/scripts/settings.ts
          sed -i 's/"Segoe UI"/"Noto Kufi Arabic", "Rubik", "Segoe UI"/g' dist/styles/global.css
          sed -i 's/"Segoe UI"/"Noto Kufi Arabic", "Rubik", "Segoe UI"/g' dist/article/article.css
          sed -i 's/ViewType.Cards/ViewType.List/g' src/main/settings.ts
          sed -i 's/this.openTarget = SourceOpenTarget.Local/this.openTarget = SourceOpenTarget.FullContent/' src/scripts/models/source.ts

      - name: Clear Webpack Cache
        run: rm -rf node_modules/.cache/webpack
        
      - name: Build React/TypeScript Code
        run: npm run build

      - name: Package Linux AppImage
        run: npm run package-linux

      - name: Get Final Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluentReader-${{ steps.version.outputs.version }}-Linux-x64
          path: bin/linux/x64/*.AppImage
          if-no-files-found: error
          compression-level: 0
