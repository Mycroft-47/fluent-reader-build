name: Build Fluent Reader Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Upstream Source Code
        uses: actions/checkout@v4
        with:
          repository: yang991178/fluent-reader
          ref: master

      - name: Checkout My Patches
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: my-patches
          ref: ${{ github.ref }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Version with Commit Hash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION="${CURRENT_VERSION}-${SHORT_SHA}"
          echo "Building version: $NEW_VERSION (upstream commit: $SHORT_SHA)"
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

      - name: Install Dependencies
        run: |
          npm install
          # Install Piper TTS WASM Library
          npm install @mintplex-labs/piper-tts-web

      - name: Inject Piper TTS Implementation
        # Copy the file from your repo (my-patches folder) to the source tree
        run: |
          echo "Overwriting article.tsx with custom version..."
          cp my-patches/article.tsx src/components/article.tsx

      - name: Apply Customizations (Fonts, Defaults)
        run: |
          # 1. Prepend Noto Kufi Arabic and Rubik to font families
          sed -i 's/"Segoe UI"/"Noto Kufi Arabic", "Rubik", "Segoe UI"/g' dist/article/article.css
          
          # 2. Default View: Change Cards to List
          sed -i 's/ViewType.Cards/ViewType.List/g' src/main/settings.ts
          
          # 3. Default Open Mode: Change Local to FullContent
          sed -i 's/this.openTarget = SourceOpenTarget.Local/this.openTarget = SourceOpenTarget.FullContent/' src/scripts/models/source.ts
        
      - name: Build React/TypeScript Code
        run: npm run build

      - name: Package Linux AppImage
        run: npm run package-linux

      - name: Get Final Version for Artifact
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluentReader-${{ steps.version.outputs.version }}-Linux-x64
          path: bin/linux/x64/*.AppImage
          if-no-files-found: error
          compression-level: 0
